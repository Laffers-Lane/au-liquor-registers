name: fetch-registers
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 18 2 * *'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fetch.py
      - run: |
          git config user.name registers-bot
          git config user.email bot@lafferslane.com
          git add data
          git commit -m "registers $(date -u +%F)" || echo nochange
          git push
